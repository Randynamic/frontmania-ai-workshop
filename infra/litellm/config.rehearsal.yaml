# Rehearsal only: docker-compose.rehearsal.yml mounts this file over config.yaml so
# the three aliases go to the local OpenAI-shaped stub (infra/rehearsal), never to Vertex.
# Participants only ever see the three aliases below;
# upstream model names come from infra/.env and are decided after the dry run.
# Verify at the D-1 spike: `os.environ/` resolution for `model` (documented for
# api_key; confirm for model by calling GET /v1/models with a virtual key).
model_list:
  - model_name: talk-picker-task
    litellm_params:
      model: os.environ/TASK_MODEL_UPSTREAM
      api_key: os.environ/OPENAI_API_KEY
  - model_name: talk-picker-embed
    litellm_params:
      model: os.environ/EMBED_MODEL_UPSTREAM
      api_key: os.environ/OPENAI_API_KEY
  - model_name: talk-picker-reflect
    litellm_params:
      model: os.environ/REFLECT_MODEL_UPSTREAM
      api_key: os.environ/OPENAI_API_KEY

litellm_settings:
  # Privacy: never log request or response bodies (CV text passes through here).
  turn_off_message_logging: true
  drop_params: true
  success_callback: []
  failure_callback: []
  request_timeout: 60

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: false
  disable_spend_logs: false
